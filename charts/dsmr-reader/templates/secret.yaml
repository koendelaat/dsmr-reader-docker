{{/*
Create a Secret for DSMR Reader application credentials only when the user
has NOT provided an existingSecret. This keeps the chart GitOps-compatible:
supply your own Secret via ExternalSecrets / Sealed Secrets and point
dsmr.credentials.existingSecret at it.

NOTE: inline credentials (adminPassword / djangoSecretKey) are intentionally
NOT auto-generated. They must be explicitly provided so that re-running
`helm upgrade` does not rotate them.
*/}}
{{- if not .Values.dsmr.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsmr-reader.fullname" . }}-credentials
  labels:
    {{- include "dsmr-reader.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.dsmr.credentials.adminPasswordKey }}: {{ required "dsmr.credentials.adminPassword is required when not using an existingSecret" .Values.dsmr.credentials.adminPassword | b64enc | quote }}
  {{ .Values.dsmr.credentials.djangoSecretKeyKey }}: {{ required "dsmr.credentials.djangoSecretKey is required when not using an existingSecret" .Values.dsmr.credentials.djangoSecretKey | b64enc | quote }}
{{- end }}

{{/*
When using an external database without an existingSecret, create a small
secret for the database password.
*/}}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsmr-reader.fullname" . }}-externaldb
  labels:
    {{- include "dsmr-reader.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.externalDatabase.existingSecretPasswordKey }}: {{ required "externalDatabase.password is required when postgresql.enabled is false and no existingSecret is set" .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
